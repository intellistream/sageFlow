name: TODO-to-Issue (PR)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  todo_to_issue:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    # 使用 GitHub 托管的 Runner
    runs-on: ubuntu-latest

    # 需要创建 Issue 和（在同仓库分支上）提交回链路
    permissions:
      contents: write # 允许 push 回 PR 分支（仅当来自同仓库分支时）
      issues: write # 允许创建/更新 Issue
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的git历史
          # 已通过 job if 保障仅在 workflow_dispatch 或同仓库 PR 运行
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.repository }}

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5
        env:
          # 避免 PR 超大 diff 触发 GitHub API 406（>20k lines）导致 action 失败
          # 使用 head commit 的 /commits/{sha} diff 路径，保持 TODO 扫描稳定
          MANUAL_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        with:
          INSERT_ISSUE_URLS: "true"
          # 对于 PR 事件，action 会自动检测 diff，无需手动指定 commits
          # 移除 DIFF_URL 和 commits 参数，让 action 使用默认的 GitHubClient 模式

      - name: Set Git User
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit and Push Changes
        # 仅当为同仓库的 PR 分支时才尝试提交回去（fork PR 无法推送）
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          git add -A
          if [[ $(git status --porcelain) ]]; then
            git commit -m "chore: add TODO issue links via todo-to-issue-action"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No TODO links to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
