[log]
level = "info"

# ==================== 基础测试 (小规模) ====================
[[performance_test]]
name = "s3j_basic"
mode = "generate_direct_use"
methods = ["s3j"]
sizes = [1000]
records_count = 1000
vector_dim = 128
parallelism = [1, 2, 4, 8, 16, 32]
window_time_ms = [10000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.clustered_join_params]
index_type = "bruteforce"
training_samples = 300
multicast_enabled = 1
overlap_ratio = 0.1

[performance_test.s3j_params]
# num_centroids 必须等于 parallelism
num_centroids = 4
enable_adaptive = 0
adapt_interval_ms = 1000
load_threshold = 0.2
multicast_k = 3

[[performance_test]]
name = "s3j_medium_p4"
mode = "generate_direct_use"
methods = ["s3j"]
sizes = [5000]
records_count = 5000
vector_dim = 128
parallelism = [4 , 8 , 16]
window_time_ms = [10000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.clustered_join_params]
index_type = "bruteforce"
training_samples = 500
multicast_enabled = 1
overlap_ratio = 0.1

[performance_test.s3j_params]
num_centroids = 4
enable_adaptive = 0
adapt_interval_ms = 1000
load_threshold = 0.2
multicast_k = 3


