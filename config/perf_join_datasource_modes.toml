seed = 42

[performance_test.clustered_join_params]
index_type = "bruteforce"
training_samples = 500
multicast_enabled = 1
overlap_ratio = 0.2

[performance_test.s3j_params]
num_centroids = 16
enable_adaptive = 0
adapt_interval_ms = 1000
load_threshold = 0.2
multicast_k = 4

