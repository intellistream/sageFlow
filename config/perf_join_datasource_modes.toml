[[performance_test]]
name = "perf_join_direct_load_sift"
mode = "direct_load"
data_source = { type = "dataset", file_path = "data/siftsmall/siftsmall_query.fvecs", expected_dim = 128, loop = 1 }
methods = ["ivf", "hdrtree"]
parallelism = [1, 2, 4]
sizes = [1000]
window_time_ms = [10000]
time_interval = 10
similarity_threshold = 0.8
records_count = 10
vector_dim = 128
window_trigger_ms = 50

[[performance_test]]
name = "perf_join_direct_use_random"
mode = "generate_direct_use"
data_source = { type = "random", log = { level = "debug" } }
methods = ["ivf", "hdrtree"]
parallelism = [1, 2, 4]
sizes = [1000]
window_time_ms = [10000]
time_interval = 10
similarity_threshold = 0.8
records_count = 10
vector_dim = 64
seed = 42
window_trigger_ms = 50
