[[performance_test]]
# Test Mode 1: Generate-Save-Load (generate data, save to file, then load from file)
name = "perf_join_gen_save_load_random"
mode = "generate_save_load"
methods = ["bruteforce", "ivf"]
#methods = ["ivf"]
sizes = [2000]
records_count = 10
vector_dim = 64
parallelism = [1,2,4,8,16]
window_time_ms = [10000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.data_source]
type = "random"

[performance_test.storage]
format = "json"  # Options: "fvecs", "json"
file_path = "test/data/generated_test_data.json"

[[performance_test]]
name = "perf_join_hdr_test"
mode = "generate_direct_use"
methods = ["hdrtree"]
sizes = [1000]
records_count = 10
vector_dim = 64
parallelism = [1]
window_time_ms = [5000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.data_source]
type = "random"

log.level = "debug"
