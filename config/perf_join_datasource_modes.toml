[log]
level = "info"

# ==================== S3J 性能测试 (生产就绪) ====================
# S3J 已验证 100% recall，使用合理规模验证功能正确性

# 小规模快速验证
[[performance_test]]
name = "s3j_small"
mode = "generate_direct_use"
methods = ["s3j"]
sizes = [500]
records_count = 500
vector_dim = 128
parallelism = [1]
window_time_ms = [5000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.clustered_join_params]
index_type = "bruteforce"
training_samples = 250
multicast_enabled = 1
overlap_ratio = 0.1

[performance_test.s3j_params]
num_centroids = 4
enable_adaptive = 0
adapt_interval_ms = 1000
load_threshold = 0.2
multicast_k = 1

# 中等规模验证（2000条记录需要更长超时）
[[performance_test]]
name = "s3j_medium"
mode = "generate_direct_use"
methods = ["s3j"]
sizes = [1000]
records_count = 1000
vector_dim = 128
parallelism = [1]
window_time_ms = [10000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

[performance_test.clustered_join_params]
index_type = "bruteforce"
training_samples = 500
multicast_enabled = 1
overlap_ratio = 0.1

[performance_test.s3j_params]
num_centroids = 4
enable_adaptive = 0
adapt_interval_ms = 1000
load_threshold = 0.2
multicast_k = 1
