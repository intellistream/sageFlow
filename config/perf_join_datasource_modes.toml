# perf_join_datasource_modes.toml

# ==========================================
# S3J Performance Test Configuration
# ==========================================

[[performance_test]]
name = "perf_join_s3j_adaptive"
mode = "generate_direct_use"  # 直接内存生成，减少 IO 干扰
methods = ["s3j"]             # 指定仅测试 S3J
sizes = [5000]          
records_count = 5000          # 默认记录数
vector_dim = 128              # 维度
parallelism = [8]   # 测试不同并行度下的扩展性
window_time_ms = [10000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.8
seed = 42

# [关键新增] S3J 专用参数配置段
# 注意：你需要确保 C++ 加载代码能读取这个段落
[performance_test.s3j_params]
num_centroids = 16          # 初始分区数
enable_adaptive = true      # 开启自适应负载均衡
adapt_interval_ms = 1000    # 调整间隔
load_threshold = 0.2        # 负载倾斜阈值

[performance_test.data_source]
type = "random"
log.level = "info"

