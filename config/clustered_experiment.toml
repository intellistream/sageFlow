# ClusteredJoin 实验配置
# 
# 包含两组实验：
# - 实验 A: Overlap Ratio × Parallelism 矩阵实验 (k=0)
# - 实验 B: Multicast K 扫描实验 (p=32)

# ==================== 通用配置 ====================
[common]
vector_dim = 128
window_size_ms = 10000
step_size_ms = 10
similarity_threshold = 0.8
seed = 42
time_interval_ms = 10
base_timestamp = 1000000
result_output_dir = "test/result/clustered_experiment"
compare_with_ground_truth = true
positive_ratio = 0.10
negative_ratio = 0.60
positive_pairs = 500
near_threshold_pairs = 50
negative_pairs = 500
random_tail = 2000
alpha = 0.1
save_results = true
generate_report = true

# ==================== 实验 A: Overlap Ratio × Parallelism 矩阵 ====================
# 固定 k=0，变化 p ∈ {1,2,4,8,16} 和 overlap_ratio ∈ {0.01,0.02,0.05,0.10,0.20}

# --- p=1 系列 ---
[[test_case]]
name = "exp_a_p1_r001"
description = "Experiment A: p=1, overlap_ratio=0.01"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 1
clustered_multicast_k = 0
clustered_overlap_ratio = 0.01
clustered_index_type = "bruteforce"
clustered_multicast_enabled = true
clustered_training_samples = 500
clustered_cold_start_enabled = true
clustered_broadcast_dedup = true
data_sizes = [2000]
parallelism = [1]
expected_min_recall = 0.10
