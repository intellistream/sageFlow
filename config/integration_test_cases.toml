# config/integration_test_cases.toml
# 集成测试用例配置
# 
# 本文件定义了 SageFlow 项目所有 Join 算法的集成测试用例配置。
# 每个测试用例可以继承 [common] 节点中的通用配置。

# ==================== 通用配置 ====================
# 所有测试用例都会继承这些默认值
[common]
vector_dim = 128
window_size_ms = 10000
step_size_ms = 1000
similarity_threshold = 0.8
seed = 42
time_interval_ms = 10
base_timestamp = 1000000
result_output_dir = "test/result/integration"
compare_with_ground_truth = true
positive_ratio = 0.10
negative_ratio = 0.60
positive_pairs = 500
near_threshold_pairs = 50
negative_pairs = 500
random_tail = 2000
alpha = 0.1
save_results = true
generate_report = true

# ==================== BruteForce 测试 ====================
# Ground Truth baseline 测试，用于验证正确性
[[test_case]]
name = "bruteforce_baseline"
description = "Ground truth baseline test - exact similarity join"
algorithm = "bruteforce"
partition_strategy = "round_robin"
window_state_type = "shared"
index_strategy = "shared"
data_sizes = [2000]
parallelism = [1, 2, 4, 8, 16, 24, 32]
expected_min_recall = 0.95
expected_min_precision = 1.0

[[test_case]]
name = "bruteforce_small_batch"
description = "BruteForce small batch test"
algorithm = "bruteforce"
partition_strategy = "round_robin"
window_state_type = "shared"
index_strategy = "shared"
data_sizes = [500]
window_size_ms = 1000
parallelism = [1, 2, 4, 8, 16]
expected_min_recall = 0.95
expected_min_precision = 1.0

