# ==================== ClusteredJoin 测试 ====================
# VectraFlow-style clustered join
[[test_case]]
name = "clustered_join_standard"
description = "VectraFlow-style clustered join with centroid partitioning"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 8
clustered_overlap_ratio = 0.1
clustered_rebalance_threshold = 0.3
clustered_border_replication = true
clustered_training_samples = 500
data_sizes = [500, 1000]
parallelism = [2, 4]
expected_min_recall = 0.80
enabled = false

[[test_case]]
name = "clustered_join_no_overlap"
description = "ClusteredJoin without boundary replication"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 8
clustered_overlap_ratio = 0.0
clustered_border_replication = false
clustered_training_samples = 500
data_sizes = [500]
parallelism = [2, 4]
expected_min_recall = 0.70
enabled = false

[[test_case]]
name = "clustered_join_high_overlap"
description = "ClusteredJoin with high overlap for better recall"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 4
