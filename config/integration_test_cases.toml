# ==================== K-值扫描测试 ====================
# 测试不同 k 值对召回率和性能的影响
# 
# **关键修复**：num_partitions 必须等于 parallelism
# 原因：CentroidPartitioner 使用 `partition_idx % num_channels` 映射
# 如果 num_partitions > parallelism，会导致召回率下降
# 例如：8 个分区 → 4 个线程时，k=1 会丢失同线程内其他分区的匹配
#
# 理论预期（num_partitions=parallelism=4）：
# - k=0（overlap_ratio 阈值模式）：召回率取决于阈值（~85-95%）
# - k=1（仅主分区）：召回率最低（~60-70%）
# - k=2（最近2个分区）：召回率中等（~75-85%）
# - k=3（最近3个分区）：召回率较高（~88-92%）
# - k=4（最近4个分区）：召回率最高（~95%+，几乎全覆盖）

[[test_case]]
name = "clustered_k_sweep_k0"
description = "ClusteredJoin with k=0 (overlap_ratio threshold mode)"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 4                  # 必须等于 parallelism！
clustered_multicast_k = 0           # 0=使用 overlap_ratio 阈值
clustered_overlap_ratio = 0.1       # 10% 距离阈值
clustered_index_type = "bruteforce"
clustered_multicast_enabled = true
clustered_training_samples = 200
clustered_cold_start_enabled = true
clustered_broadcast_dedup = true
data_sizes = [500]
parallelism = [4]
expected_min_recall = 0.85
enabled = false

[[test_case]]
name = "clustered_k_sweep_k1"
description = "ClusteredJoin with k=1 (unicast)"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 4                  # 必须等于 parallelism！
clustered_multicast_k = 1           # 仅主分区
clustered_index_type = "bruteforce"
clustered_multicast_enabled = true
clustered_training_samples = 200   # 增加训练样本
training_samples = 200             # 添加通用字段确保加载
clustered_cold_start_enabled = true
clustered_broadcast_dedup = true
data_sizes = [500]
parallelism = [4]
expected_min_recall = 0.60
enabled = true

