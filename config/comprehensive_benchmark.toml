# ==================== 双层索引算法 (VSJoin) ====================
# 公共分区参数：LSH partitioner, fanout_budget 控制 recall-latency tradeoff
# 保持与 ClusteredJoin 的多播参数一致性:
#   cj_k1 ↔ vsj_f1, cj_k2 ↔ vsj_f2, cj_k3 ↔ vsj_f3, cj_k4 ↔ vsj_f4

# --- VSJoin fanout=1 (unicast) ---
[[test_case]]
name = "vsjoin_f1"
description = "VSJoin fanout_budget=1 (unicast)"
algorithm = "vsjoin"
partition_strategy = "lsh"
window_state_type = "two_tier"
index_strategy = "partitioned"
num_partitions = 8
vsjoin_num_hash_functions = 8
vsjoin_boundary_threshold = 0.1
vsjoin_rebuild_interval_ms = 3000
vsjoin_rebuild_threshold = 500
vsjoin_fanout_budget = 1
ivf_nlist = 50
ivf_nprobes = 10
window_size_ms = 1000
step_size_ms = 10
data_sizes = [500, 1000, 2000]
parallelism = [1, 4, 8]
expected_min_recall = 0.30
enabled = true

