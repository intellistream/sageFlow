# ================================================================
# Comprehensive Benchmark Configuration
# ================================================================
# 目标：覆盖所有算法 × 多数据规模 × 多并行度
# 保证分区算法（ClusteredJoin / VSJoin）的多播参数一致性
#
# 算法分类：
#   共享索引: bruteforce, ivf, hnsw
#   分区索引: clustered_join (centroid partitioner)
#   双层索引: vsjoin (LSH partitioner)
#
# 公共参数：
#   similarity_threshold = 0.8
#   window_size_ms = 1000, step_size_ms = 10
#   dimension = 128 (默认)
# ================================================================

# ==================== 共享索引算法 ====================

# --- BruteForce (Ground Truth) ---
[[test_case]]
name = "bruteforce_bench"
description = "BruteForce ground truth"
algorithm = "bruteforce"
partition_strategy = "round_robin"
window_state_type = "shared"
index_strategy = "shared"
data_sizes = [500, 1000, 2000]
parallelism = [1, 2, 4, 8]
expected_min_recall = 0.99
enabled = true

# --- IVF (Shared Index) ---
[[test_case]]
name = "ivf_bench"
description = "IVF approximate join with shared index"
algorithm = "ivf"
partition_strategy = "round_robin"
window_state_type = "shared"
index_strategy = "shared"
ivf_nlist = 50
ivf_nprobes = 10
data_sizes = [500, 1000, 2000]
parallelism = [1, 2, 4, 8]
expected_min_recall = 0.90
enabled = true

# --- HNSW (Shared Index) ---
[[test_case]]
name = "hnsw_bench"
description = "HNSW approximate join with shared index"
algorithm = "hnsw"
partition_strategy = "round_robin"
window_state_type = "shared"
index_strategy = "shared"
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 50
data_sizes = [500, 1000, 2000]
parallelism = [1, 2, 4, 8]
expected_min_recall = 0.85
enabled = false

# ==================== 分区索引算法 (ClusteredJoin) ====================
# 公共分区参数：centroid partitioner, training_samples = 100
# multicast_k 控制 recall-latency tradeoff
# num_partitions 必须 = max(parallelism)

# --- ClusteredJoin k=1 (unicast, 最低召回/最低延迟) ---
[[test_case]]
name = "clustered_k1"
description = "ClusteredJoin multicast_k=1 (unicast)"
algorithm = "clustered_join"
partition_strategy = "centroid"
window_state_type = "partitioned"
index_strategy = "partitioned"
num_partitions = 8
clustered_multicast_k = 1
clustered_overlap_ratio = 0.0
clustered_index_type = "bruteforce"
clustered_multicast_enabled = true
clustered_training_samples = 100
clustered_cold_start_enabled = true
clustered_broadcast_dedup = true
window_size_ms = 1000
step_size_ms = 10
data_sizes = [500, 1000, 2000]
parallelism = [1, 4, 8]
expected_min_recall = 0.30
enabled = true

