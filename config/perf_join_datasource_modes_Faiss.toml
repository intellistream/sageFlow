# ==============================================================================
# Faiss Standard Performance Configuration
# based on user provided template
# ==============================================================================

log.level = "debug"

# ------------------------------------------------------------------------------
# Test Mode 1: Generate-Save-Load (生成数据 -> 保存 -> 加载 -> 测试)
# ------------------------------------------------------------------------------
[[performance_test]]
name = "perf_faiss_gen_save_load"
mode = "generate_save_load"
methods = ["faiss_ivf", "faiss_hnsw"]
sizes = [10000]          
records_count = 10      
vector_dim = 64
parallelism = [1] 
window_time_ms = [100000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.95
seed = 42
[performance_test.data_source]
type = "random"

[performance_test.storage]
format = "json"
file_path = "test/data/faiss_standard_test_data.json"


# ------------------------------------------------------------------------------
# Test Mode 2: Generate and Use Directly (纯内存生成与计算)
# ------------------------------------------------------------------------------
[[performance_test]]
name = "perf_faiss_direct_use"
mode = "generate_direct_use"
methods = ["faiss_ivf", "faiss_hnsw"]
sizes = [10000]
records_count = 10
vector_dim = 64
parallelism = [1]
window_time_ms = [100000]
window_trigger_ms = 50
time_interval = 10
similarity_threshold = 0.95
seed = 42

[performance_test.data_source]
type = "random"