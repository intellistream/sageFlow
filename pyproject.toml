[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "isage-flow"
version = "0.1.3.1"
description = "BriskFlow - Vector-native stream processing engine for join-backed semantic windows"
authors = [
    { name = "IntelliStream Team" }
]
maintainers = [
    { name = "ziao (ZeroJustMe)" },
    { name = "xincai (Pygone)" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26.0,<2.3.0",
]

[project.optional-dependencies]
full = []
dev = [
    "isage-flow[full]",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://datasys.sage.org.ai/"
Documentation = "https://github.com/DataSysResearch/BriskFlow/tree/main/docs"
Repository = "https://github.com/DataSysResearch/BriskFlow"
Issues = "https://github.com/DataSysResearch/BriskFlow/issues"

[tool.scikit-build]
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["sage_flow"]
install.components = ["sage_flow"]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
