[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.11.0",
    "cmake>=3.15",
]
build-backend = "scikit_build_core.build"

[project]
name = "isage-flow"
dynamic = ["version"]
description = "Vector-native stream processing engine for incremental semantic state snapshots"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn"}
]
keywords = ["stream processing", "semantic search", "vector database", "incremental indexing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
]
publish = [
    "sage-pypi-publisher==0.1.4"
]

[project.urls]
Homepage = "https://github.com/intellistream/sageFlow"
Documentation = "https://github.com/intellistream/sageFlow#readme"
Repository = "https://github.com/intellistream/sageFlow"
Issues = "https://github.com/intellistream/sageFlow/issues"

[tool.scikit-build]
cmake.args = [
    "-DBUILD_TESTS=OFF",
    "-DUSE_OPENMP=ON",
]
cmake.verbose = true
build-dir = "build/{wheel_tag}"
wheel.install-dir = "sage_flow"
wheel.packages = ["sage_flow"]
wheel.py-api = "cp311"
wheel.expand-macos-universal-tags = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "sage_flow/_version.py"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux*", "*-win32", "*-manylinux_i686"]

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y openblas-devel lapack-devel || apt-get update && apt-get install -y libopenblas-dev liblapack-dev"
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
